name: Materialize Earth Essence Engage fix

on:
  push:
    branches: [fix/battle-mechanics-audit-01.05.001]

permissions:
  contents: write

concurrency:
  group: materialize-earth-essence-engage-fix
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/battle-mechanics-audit-01.05.001
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node scripts/apply-earth-essence-engage-fix.mjs
      - name: Commit engine fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js
          git commit -m "fix: model Earth Essence Engage"
          git push origin HEAD:fix/battle-mechanics-audit-01.05.001
