name: Apply filter QoL patch

on:
  push:
    paths:
      - ".github/workflows/apply-filter-qol.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch index and app
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          marker = '<label><input id="show-excluded" type="checkbox"> Show excluded cards</label>'
          addition = marker + '\n        <label><input id="show-unavailable" type="checkbox"> Show unavailable filters</label>'
          if 'id="show-unavailable"' not in html:
              if marker not in html:
                  raise SystemExit('index marker missing')
              html = html.replace(marker, addition, 1)
          index.write_text(html, encoding='utf-8')

          app = Path('js/app.js')
          t = app.read_text(encoding='utf-8')

          if 'showUnavailable: document.getElementById("show-unavailable")' not in t:
              marker = '  showExcluded: document.getElementById("show-excluded"),'
              if marker not in t:
                  raise SystemExit('els marker missing')
              t = t.replace(marker, marker + '\n  showUnavailable: document.getElementById("show-unavailable"),', 1)

          if 'state.showUnavailableFilters = els.showUnavailable.checked;' not in t:
              marker = '  els.clearDeck.addEventListener("click", () => {'
              block = '''  els.showUnavailable.addEventListener("change", () => {
            state.showUnavailableFilters = els.showUnavailable.checked;
            persist();
            renderEverything();
          });

          '''
              if marker not in t:
                  raise SystemExit('clear deck marker missing')
              t = t.replace(marker, block + marker, 1)

          if 'els.showUnavailable.checked = state.showUnavailableFilters;' not in t:
              marker = '  els.showExcluded.checked = state.showExcluded;'
              if marker not in t:
                  raise SystemExit('sync marker missing')
              t = t.replace(marker, marker + '\n  els.showUnavailable.checked = state.showUnavailableFilters;', 1)

          start = t.index('function renderCheckboxGroup(')
          end = t.index('\nfunction renderArchetypes()', start)
          section = t[start:end]
          old_start = section.index('    const count = classPool.filter(card => {')
          old_end_marker = '    label.append(input, document.createTextNode(value));'
          old_end = section.index(old_end_marker, old_start)
          replacement = '''    const count = getFilterOptionResultCount(title, value, targetSet);
              if (!state.showUnavailableFilters && count === 0 && !targetSet.has(value)) continue;

          '''
          section = section[:old_start] + replacement + section[old_end:]
          t = t[:start] + section + t[end:]

          if 'function getFilterOptionResultCount(' not in t:
              marker = '\nfunction renderArchetypes() {'
              helper = r'''
          function getFilterOptionResultCount(title, value, targetSet) {
            const original = [...targetSet];
            const andGroup = title === "Trait" || title === "Keyword";
            targetSet.clear();

            if (andGroup) {
              for (const selected of original) targetSet.add(selected);
              targetSet.add(value);
            } else {
              targetSet.add(value);
            }

            const count = filteredCards().length;
            targetSet.clear();
            for (const selected of original) targetSet.add(selected);
            return count;
          }
          '''
              if marker not in t:
                  raise SystemExit('render archetypes marker missing')
              t = t.replace(marker, helper + marker, 1)

          old_saved = '<div class="muted">${escapeHtml(variant.class ?? "Unknown")} · ${size}/40</div>'
          if old_saved in t:
              new_saved = '<div class="muted">${escapeHtml(variant.class ?? "Unknown")} · ${size > 40 ? `40 (+${size - 40})` : `${size}/40`}</div>'
              t = t.replace(old_saved, new_saved, 1)

          app.write_text(t, encoding='utf-8')
          PY

      - run: node --check js/app.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/app.js
          git commit -m "feat: add unavailable-filter QoL and overflow labels"
          git push
