name: Purge old Actions runs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/purge-old-actions-runs.yml"

permissions:
  actions: write
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Purge workflow runs older than 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Cutoff: $cutoff"

          gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/runs.json
          jq -r --arg cutoff "$cutoff" '.[] | .workflow_runs[] | select(.created_at < $cutoff) | .id' /tmp/runs.json > /tmp/old-run-ids.txt

          total="$(wc -l < /tmp/old-run-ids.txt | tr -d ' ')"
          echo "Runs to delete: $total"

          if [ "$total" -gt 0 ]; then
            export GH_TOKEN GITHUB_REPOSITORY
            xargs -r -P 8 -n 1 sh -c 'gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/$1" >/dev/null && echo "Deleted $1"' _ < /tmp/old-run-ids.txt
          fi

          gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/runs-after.json
          remaining_old="$(jq -r --arg cutoff "$cutoff" '[.[] | .workflow_runs[] | select(.created_at < $cutoff)] | length' /tmp/runs-after.json)"
          echo "Remaining runs older than cutoff: $remaining_old"
          test "$remaining_old" -eq 0

      - name: Remove temporary purge workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/purge-old-actions-runs.yml
          git commit -m "chore: remove temporary Actions purge workflow"
          git push
