name: Apply Swordcraft Battle Sim rules

on:
  push:
    branches: [chatgpt/swordcraft-audit]
    paths:
      - ".github/workflows/apply-battle-swordcraft-full.yml"
      - "scripts/apply-battle-swordcraft-full.py"
      - "scripts/check-battle-swordcraft-full.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Materialize Swordcraft rules
        run: python3 scripts/apply-battle-swordcraft-full.py

      - name: Check changed JavaScript syntax
        run: |
          node --check js/battle-rules.js
          node --check js/battle-engine-v5.js
          node --check scripts/check-battle-swordcraft-full.mjs

      - name: Run Swordcraft regression
        run: |
          node scripts/check-battle-swordcraft-full.mjs
          node scripts/check-battle-coverage-100.mjs
          node scripts/check-battle-rules.mjs
          node scripts/check-battle-reactive-events.mjs
          node scripts/check-battle-runecraft-full.mjs

      - name: Commit tested engine changes
        run: |
          if git diff --quiet -- js/battle-rules.js js/battle-engine-v5.js; then
            echo "No engine changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-rules.js js/battle-engine-v5.js
          git commit -m "feat: complete Swordcraft Battle Sim class pass"
          git push origin HEAD:${{ github.ref_name }}
