name: Materialize class mechanic boundaries

on:
  push:
    branches: [fix/class-mechanic-boundaries-01.04.003]

permissions:
  contents: write

concurrency:
  group: materialize-class-mechanic-boundaries
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/class-mechanic-boundaries-01.04.003
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Apply class mechanic boundaries
        run: node scripts/apply-class-mechanic-boundaries.mjs
      - name: Commit materialized changes
        run: |
          if git diff --quiet; then
            echo "No materialized changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js js/battle-engine-core.js js/battle.js js/battle-replay-inspector.js version.json
          git commit -m "fix: isolate class-specific Battle Sim mechanics"
          git push origin HEAD:fix/class-mechanic-boundaries-01.04.003
