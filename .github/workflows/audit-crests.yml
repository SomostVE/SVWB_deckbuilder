name: Audit Crests

on:
  push:
    branches: [audit/crest-completeness-01.05.001]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node scripts/audit-battle-crests.mjs
