name: Apply Battle AI Stage 5

on:
  push:
    branches:
      - ai-stage5-01.05.007

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ai-stage5-01.05.007
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Repair nested template in migration helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-battle-ai-stage5.mjs')
          source = path.read_text()
          source = source.replace('const branchRng = createRng(`${seed}|lethal|${sequence.map(actionKey).join(">")}`);', 'const branchRng = createRng(seed + "|lethal|" + sequence.map(actionKey).join(">"));')
          path.write_text(source)
          PY
      - name: Apply stage 5 migration
        run: node scripts/apply-battle-ai-stage5.mjs
      - name: Validate lethal solver
        run: |
          node --check js/battle-engine-v5.js
          node --check scripts/audit-battle-ai-behavior.mjs
          node scripts/audit-battle-ai-behavior.mjs
          node scripts/check-battle-ai-lethal.mjs
          node scripts/check-battle-turn-planner.mjs
      - name: Commit lethal solver
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js scripts/audit-battle-ai-behavior.mjs version.json battle.html
          git commit -m "Apply Battle AI stage 5 lethal solver"
          git push origin HEAD:ai-stage5-01.05.007
