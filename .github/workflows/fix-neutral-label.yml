name: Fix neutral label

on:
  push:
    paths:
      - ".github/workflows/fix-neutral-label.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fix neutral label
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('js/app.js')
          js = app.read_text(encoding='utf-8')
          old = 'neutral.append(checkbox, document.createTextNode(" Include Neutral"));'
          new = 'neutral.append(checkbox, document.createTextNode(" Neutral"));'
          if old not in js:
              raise SystemExit('neutral label anchor missing')
          js = js.replace(old, new, 1)
          app.write_text(js, encoding='utf-8')

          base = Path('css/base.css')
          css = base.read_text(encoding='utf-8')
          hack = '''.neutral-toggle {
            font-size: 0;
          }

          .neutral-toggle input {
            font-size: initial;
          }

          .neutral-toggle::after {
            content: " Neutral";
            font-size: .8rem;
          }

          '''
          if hack not in css:
              raise SystemExit('neutral css hack missing')
          css = css.replace(hack, '', 1)
          base.write_text(css, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check js/app.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js css/base.css
          git commit -m "fix: show neutral label once"
          git push
