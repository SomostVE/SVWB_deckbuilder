name: Audit Dragoncraft Battle Sim

on:
  push:
    branches: [agent/dragoncraft-audit]
    paths:
      - ".github/workflows/audit-battle-dragoncraft.yml"
      - "scripts/audit-battle-class.mjs"
      - "js/battle-engine-v5.js"
      - "js/battle-rules.js"
      - "data/official/cards.json"
  pull_request:
    paths:
      - ".github/workflows/audit-battle-dragoncraft.yml"
      - "scripts/audit-battle-class.mjs"
      - "js/battle-engine-v5.js"
      - "js/battle-rules.js"
      - "data/official/cards.json"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Audit Dragoncraft support
        run: node scripts/audit-battle-class.mjs Dragoncraft

      - name: Inspect Dragoncraft engine hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = {
            'js/battle-engine-v5.js': [
              'function damageUnit(', 'function afterLeaderHeal(', 'function crestCountdown(',
              'function applyCrestTurnEnd(', 'function applyEntryEvents(',
              'function evolveUnitByAbility(', 'function superEvolveUnitByAbility(',
              'function attackWithUnit(', 'function turnEnd(', 'function makePlayer(',
              'function gainCrest(', 'function resolveCardText(', 'function cleanupDead('
            ],
            'js/battle-rules.js': ['function applyEntryCrestEffects', 'export function applyEntryCrestEffects']
          }
          for path, needles in targets.items():
            lines = Path(path).read_text(encoding='utf-8').splitlines()
            print(f'\n######## {path} ########')
            for needle in needles:
              hits = [i for i, line in enumerate(lines) if needle in line]
              for i in hits:
                lo=max(0,i-8); hi=min(len(lines),i+85)
                print(f'\n===== {needle} @ line {i+1} =====')
                for n in range(lo,hi): print(f'{n+1:05d}: {lines[n]}')
          PY
