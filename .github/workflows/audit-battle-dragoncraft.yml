name: Audit Dragoncraft Battle Sim

on:
  push:
    branches: [agent/dragoncraft-audit]
    paths:
      - ".github/workflows/audit-battle-dragoncraft.yml"
      - "scripts/audit-battle-class.mjs"
      - "js/battle-engine-v5.js"
      - "data/official/cards.json"
  pull_request:
    paths:
      - ".github/workflows/audit-battle-dragoncraft.yml"
      - "scripts/audit-battle-class.mjs"
      - "js/battle-engine-v5.js"
      - "data/official/cards.json"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Audit Dragoncraft support
        run: node scripts/audit-battle-class.mjs Dragoncraft

      - name: Inspect Dragoncraft crest card source fields
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs/promises';
          const cards = JSON.parse(await fs.readFile('./data/official/cards.json', 'utf8'));
          const ids = new Set([10841130, 10441310, 10544120, 10844110, 10144110, 10744120]);
          for (const card of cards.filter(card => ids.has(Number(card.id)))) {
            console.log(`\n=== SOURCE ${card.id} :: ${card.name} ===`);
            console.log(JSON.stringify(card, null, 2));
          }
          EOF
