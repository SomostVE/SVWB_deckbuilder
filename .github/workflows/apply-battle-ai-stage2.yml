name: Apply Battle AI Stage 2

on:
  push:
    branches:
      - ai-stage2-01.05.004

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ai-stage2-01.05.004
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply stage 2 migration
        run: node scripts/apply-battle-ai-stage2.mjs
      - name: Commit migrated engine
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js scripts/audit-battle-ai-behavior.mjs version.json battle.html
          git commit -m "Apply Battle AI stage 2 efficiency scoring"
          git push origin HEAD:ai-stage2-01.05.004
