name: Materialize Battle AI Stage 7 final

on:
  push:
    branches:
      - ai-stage7-final-01.05.009

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ai-stage7-final-01.05.009
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Apply, verify and commit Stage 7
        run: |
          set +e
          : > .stage7-materialize-diagnostic.log
          node scripts/apply-battle-ai-stage7.mjs >> .stage7-materialize-diagnostic.log 2>&1
          apply_code=$?
          echo "apply_exit=$apply_code" >> .stage7-materialize-diagnostic.log
          node --check js/battle-engine-v5.js >> .stage7-materialize-diagnostic.log 2>&1
          syntax_code=$?
          echo "engine_syntax_exit=$syntax_code" >> .stage7-materialize-diagnostic.log
          node --check scripts/check-battle-ai-stage7-evolution.mjs >> .stage7-materialize-diagnostic.log 2>&1
          gate_syntax_code=$?
          echo "gate_syntax_exit=$gate_syntax_code" >> .stage7-materialize-diagnostic.log
          git status --short >> .stage7-materialize-diagnostic.log 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$apply_code" -eq 0 ] && [ "$syntax_code" -eq 0 ] && [ "$gate_syntax_code" -eq 0 ]; then
            git add js/battle-engine-v5.js version.json battle.html .github/workflows/validate-site.yml scripts/check-battle-ai-stage7-evolution.mjs .stage7-materialize-diagnostic.log
            git commit -m "Apply Battle AI stage 7 evolution policy"
          else
            git add .stage7-materialize-diagnostic.log
            git commit -m "Capture Stage 7 materialization failure"
          fi
          git push origin HEAD:ai-stage7-final-01.05.009
