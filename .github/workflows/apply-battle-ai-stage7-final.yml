name: Diagnose Battle AI Stage 7 final

on:
  push:
    branches:
      - ai-stage7-final-01.05.009

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ai-stage7-final-01.05.009
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Capture Stage 7 migration result
        run: |
          set +e
          node scripts/apply-battle-ai-stage7.mjs > .stage7-diagnostic.log 2>&1
          code=$?
          echo "exit_code=$code" >> .stage7-diagnostic.log
          node --check js/battle-engine-v5.js >> .stage7-diagnostic.log 2>&1
          echo "syntax_exit=$?" >> .stage7-diagnostic.log
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .stage7-diagnostic.log
          git commit -m "Capture Stage 7 migration diagnostics"
          git push origin HEAD:ai-stage7-final-01.05.009
