name: Final Battle Sim all-card audit

on:
  push:
    branches: [agent/final-battle-audit]
    paths:
      - ".github/workflows/audit-battle-final.yml"
      - "scripts/audit-battle-final.mjs"
      - "scripts/audit-battle-class.mjs"
      - "scripts/check-battle-*.mjs"
      - "js/battle-engine-v4.js"
      - "js/battle-engine-v5.js"
      - "data/official/cards.json"
  pull_request:
    paths:
      - ".github/workflows/audit-battle-final.yml"
      - "scripts/audit-battle-final.mjs"
      - "scripts/audit-battle-class.mjs"
      - "scripts/check-battle-*.mjs"
      - "js/battle-engine-v4.js"
      - "js/battle-engine-v5.js"
      - "data/official/cards.json"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run final all-card audit
        run: node scripts/audit-battle-final.mjs
      - name: Inspect Havencraft gaps
        run: node scripts/audit-battle-class.mjs Havencraft
