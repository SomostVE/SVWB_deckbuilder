name: Battle Sim rebenchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "js/battle-engine*.js"
      - "js/battle-rules*.js"
      - "js/battle-benchmark-core.js"
      - "scripts/rebenchmark-battle-v5.mjs"
      - "scripts/audit-remaining-coverage.mjs"
      - ".github/workflows/battle-rebenchmark.yml"

jobs:
  rebenchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify remaining partial-card audit
        run: node scripts/audit-remaining-coverage.mjs

      - name: Rebenchmark 100 percent rule coverage
        run: node scripts/rebenchmark-battle-v5.mjs
