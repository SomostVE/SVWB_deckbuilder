name: Apply deck overflow patch

on:
  push:
    paths:
      - ".github/workflows/apply-deck-overflow.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch app.js
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text(encoding="utf-8")

          old_count = '  els.deckCount.textContent = `${getDeckSize()} / 40`;'
          new_count = '''  const deckSize = getDeckSize();
            els.deckCount.innerHTML = deckSize > 40
              ? `40 <span class="deck-overflow">(+${deckSize - 40})</span>`
              : `${deckSize} / 40`;'''

          old_limit = '  let remaining = 40;'
          new_limit = '  let remaining = 80;'

          if old_count not in text:
              raise SystemExit("Deck count expression not found")
          if old_limit not in text:
              raise SystemExit("sanitizeDeck limit not found")

          text = text.replace(old_count, new_count, 1)
          text = text.replace(old_limit, new_limit, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "feat: display overflow cards above 40"
          git push
