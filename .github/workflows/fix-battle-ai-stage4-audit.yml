name: Fix Battle AI Stage 4 Audit

on:
  push:
    branches:
      - ai-stage4-01.05.006

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ai-stage4-01.05.006
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Refine deterministic scenarios
        run: node scripts/fix-battle-ai-stage4-audit.mjs
      - name: Commit scenario refinement
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-battle-ai-behavior.mjs
          git commit -m "Refine Battle AI stage 4 exchange scenarios"
          git push origin HEAD:ai-stage4-01.05.006
