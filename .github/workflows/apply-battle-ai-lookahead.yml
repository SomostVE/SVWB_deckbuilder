name: Apply Battle Sim look-ahead AI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-battle-ai-lookahead.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Materialize tactical look-ahead
        run: python3 scripts/materialize-battle-ai-lookahead.py

      - name: Validate look-ahead and Battle Sim
        run: |
          node --check js/battle-engine-v5.js
          node scripts/check-battle-ai-lookahead.mjs
          node scripts/check-battle-rules.mjs
          node scripts/check-battle-reactive-events.mjs
          node scripts/check-battle-artifact-history.mjs
          node scripts/check-battle-focus-rules.mjs
          node scripts/check-battle-ability-evolve.mjs
          node scripts/check-battle-asher.mjs
          node scripts/check-battle-coverage-100.mjs
          node scripts/check-battle-v5-integration.mjs
          node scripts/check-battle-sim.mjs
          node scripts/check-battle-benchmark.mjs
          node scripts/check-battle-benchmark-calibration.mjs
          node scripts/check-battle-benchmark-compare.mjs

      - name: Run 1000-game AI mirrors
        run: node scripts/benchmark-reference-mirrors.mjs

      - name: Commit validated look-ahead and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js scripts/check-battle-ai-lookahead.mjs
          git rm scripts/materialize-battle-ai-lookahead.py .github/workflows/apply-battle-ai-lookahead.yml
          git commit -m "feat: add tactical look-ahead to Battle Sim AI"
          git push
