name: Audit Fuse cards
on:
  push:
    branches: [main]
    paths:
      - scripts/audit-fuse-cards.mjs
      - .github/workflows/audit-fuse-cards.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/audit-fuse-cards.mjs
