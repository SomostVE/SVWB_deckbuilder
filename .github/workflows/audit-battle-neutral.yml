name: Audit Neutral Battle Sim

on:
  push:
    branches: [agent/neutral-audit]
    paths:
      - ".github/workflows/audit-battle-neutral.yml"
      - "scripts/audit-battle-class.mjs"
      - "js/battle-engine-v5.js"
      - "data/official/cards.json"
  pull_request:
    paths:
      - ".github/workflows/audit-battle-neutral.yml"
      - "scripts/audit-battle-class.mjs"
      - "js/battle-engine-v5.js"
      - "data/official/cards.json"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Audit Neutral support
        run: node scripts/audit-battle-class.mjs Neutral
      - name: Inspect Neutral source metadata and hooks
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const cards = JSON.parse(await fs.readFile('data/official/cards.json','utf8'));
          const m = cards.find(c => Number(c.id) === 10304110);
          console.log('MJERRABAINE_OBJECT', JSON.stringify(m));
          console.log('HEIRS_COUNT', cards.filter(c => Number(c.setId) === 10003).length);
          NODE
          grep -nE 'function (drawCards|damageUnit|strike|turnEnd|tickCrests|resolveEngage|gainCrest|makePlayer)|battle-portalcraft-resolve-text|battle-portalcraft-crest-countdowns|const end = turnEnd|cannot draw from an empty deck|applyPortalcraftSpellPlayedTriggers' js/battle-engine-v5.js
