name: Audit Neutral Battle Sim

on:
  push:
    branches: [agent/neutral-audit]
    paths:
      - ".github/workflows/audit-battle-neutral.yml"
      - "scripts/audit-battle-class.mjs"
      - "js/battle-engine-v5.js"
      - "data/official/cards.json"
  pull_request:
    paths:
      - ".github/workflows/audit-battle-neutral.yml"
      - "scripts/audit-battle-class.mjs"
      - "js/battle-engine-v5.js"
      - "data/official/cards.json"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Audit Neutral support
        run: node scripts/audit-battle-class.mjs Neutral
      - name: Inspect Mjerrabaine source metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const cards = JSON.parse(await fs.readFile('data/official/cards.json','utf8'));
          const m = cards.find(c => Number(c.id) === 10304110);
          console.log('MJERRABAINE_OBJECT', JSON.stringify(m));
          const keys = Object.keys(m ?? {});
          for (const key of keys) {
            const value = m[key];
            if (typeof value === 'string' || typeof value === 'number') {
              const same = cards.filter(c => c[key] === value);
              if (same.length >= 70 && same.length <= 90) console.log('CANDIDATE_SET_FIELD', key, JSON.stringify(value), same.length);
            }
          }
          NODE
