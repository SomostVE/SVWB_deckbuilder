name: Battle Sim high-risk foundation

on:
  push:
    branches: [agent/high-risk-audit]
    paths:
      - ".github/workflows/audit-battle-high-risk-foundation.yml"
      - "scripts/apply-battle-high-risk-foundation.py"
      - "scripts/apply-battle-high-risk-grammar.py"
      - "scripts/apply-battle-high-risk-grammar-fixes.py"
      - "scripts/apply-battle-high-risk-order-fixes.py"
      - "scripts/apply-battle-high-risk-final-fixes.py"
      - "scripts/apply-battle-high-risk-lifecycle.py"
      - "scripts/apply-battle-high-risk-common.py"
      - "scripts/apply-battle-high-risk-common-fixes.py"
      - "scripts/apply-battle-high-risk-probe.py"
      - "scripts/audit-battle-high-risk-runtime.mjs"
      - "js/battle-engine-v5.js"
      - "js/battle-rules.js"
  pull_request:
    paths:
      - ".github/workflows/audit-battle-high-risk-foundation.yml"
      - "scripts/apply-battle-high-risk-foundation.py"
      - "scripts/apply-battle-high-risk-grammar.py"
      - "scripts/apply-battle-high-risk-grammar-fixes.py"
      - "scripts/apply-battle-high-risk-order-fixes.py"
      - "scripts/apply-battle-high-risk-final-fixes.py"
      - "scripts/apply-battle-high-risk-lifecycle.py"
      - "scripts/apply-battle-high-risk-common.py"
      - "scripts/apply-battle-high-risk-common-fixes.py"
      - "scripts/apply-battle-high-risk-probe.py"
      - "scripts/audit-battle-high-risk-runtime.mjs"
      - "js/battle-engine-v5.js"
      - "js/battle-rules.js"

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Materialize high-risk generic foundation locally
        run: python3 scripts/apply-battle-high-risk-foundation.py
      - name: Materialize high-risk grammar locally
        run: python3 scripts/apply-battle-high-risk-grammar.py
      - name: Apply grammar helper fixes locally
        run: python3 scripts/apply-battle-high-risk-grammar-fixes.py
      - name: Apply compound ordering fixes locally
        run: python3 scripts/apply-battle-high-risk-order-fixes.py
      - name: Apply final high-risk fixes locally
        run: python3 scripts/apply-battle-high-risk-final-fixes.py
      - name: Materialize natural lifecycle dispatch locally
        run: python3 scripts/apply-battle-high-risk-lifecycle.py
      - name: Materialize common high-risk rules locally
        run: python3 scripts/apply-battle-high-risk-common.py
      - name: Apply generated common fixes locally
        run: python3 scripts/apply-battle-high-risk-common-fixes.py
      - name: Materialize runtime probe locally
        run: python3 scripts/apply-battle-high-risk-probe.py
      - name: Check engine and audit syntax
        run: |
          node --check js/battle-engine-v5.js
          node --check js/battle-rules.js
          node --check scripts/audit-battle-high-risk-runtime.mjs
      - name: Execute generic high-risk cards
        run: node scripts/audit-battle-high-risk-runtime.mjs
      - name: Run core regressions
        run: |
          node scripts/check-battle-rules.mjs
          node scripts/check-battle-reactive-events.mjs
          node scripts/check-battle-fuse.mjs
          node scripts/check-battle-coverage-100.mjs
          node scripts/check-battle-forestcraft-full.mjs
          node scripts/check-battle-swordcraft-full.mjs
          node scripts/check-battle-runecraft-full.mjs
          node scripts/check-battle-dragoncraft-full.mjs
          node scripts/check-battle-abysscraft-full.mjs
          node scripts/check-battle-havencraft-full.mjs
          node scripts/check-battle-portalcraft-full.mjs
          node scripts/check-battle-neutral-full.mjs
