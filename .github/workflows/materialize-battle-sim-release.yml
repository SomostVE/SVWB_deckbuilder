name: Materialize Battle Sim release

on:
  push:
    branches: [release/battle-sim-finish-01.05.000]

permissions:
  contents: write

concurrency:
  group: materialize-battle-sim-release
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/battle-sim-finish-01.05.000
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Apply Battle Sim release changes
        run: |
          node scripts/apply-battle-sim-release.mjs
          node scripts/apply-battle-benchmark-class.mjs
      - name: Commit materialized changes
        run: |
          if git diff --quiet; then
            echo "No materialized changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js js/battle-rules-core.js js/battle.js js/battle-replay-inspector.js js/battle-benchmark-fast.js js/battle-benchmark-fast-worker.js
          git commit -m "feat: enforce class mechanics across Battle Sim"
          git push origin HEAD:release/battle-sim-finish-01.05.000
