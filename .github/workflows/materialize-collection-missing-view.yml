name: Materialize Collection missing view

on:
  push:
    branches:
      - feature/collection-missing-view-01.02.003
    paths:
      - ".github/workflows/materialize-collection-missing-view.yml"
      - "scripts/apply-collection-missing-view.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/collection-missing-view-01.02.003

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Apply Collection missing view
        run: python3 scripts/apply-collection-missing-view.py

      - name: Check Collection JavaScript
        run: node --check js/collection-page.js

      - name: Run Collection regression
        run: node scripts/check-collection-ui-structure.mjs

      - name: Commit materialized changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection.html css/collection-layout.css js/collection-page.js scripts/check-collection-ui-structure.mjs version.json
          git commit -m "feat: improve missing collection view"
          git push origin HEAD:feature/collection-missing-view-01.02.003
