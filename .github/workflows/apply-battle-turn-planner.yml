name: Apply full-turn Battle Sim planner

on:
  push:
    branches: [main]
    paths:
      - scripts/materialize-battle-turn-planner.py
      - scripts/check-battle-turn-planner.mjs
      - .github/workflows/apply-battle-turn-planner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Materialize full-turn planner
        run: python3 scripts/materialize-battle-turn-planner.py

      - name: Validate planner and Battle Sim
        run: |
          node --check js/battle-engine-v5.js
          node scripts/check-battle-turn-planner.mjs
          node scripts/check-battle-target-branching.mjs
          node scripts/check-battle-fuse.mjs
          node scripts/check-battle-ai-lookahead.mjs
          node scripts/check-battle-rules.mjs
          node scripts/check-battle-reactive-events.mjs
          node scripts/check-battle-artifact-history.mjs
          node scripts/check-battle-focus-rules.mjs
          node scripts/check-battle-ability-evolve.mjs
          node scripts/check-battle-asher.mjs
          node scripts/check-battle-coverage-100.mjs
          node scripts/check-battle-v5-integration.mjs
          node scripts/check-battle-sim.mjs
          node scripts/check-battle-benchmark.mjs
          node scripts/check-battle-benchmark-calibration.mjs
          node scripts/check-battle-benchmark-compare.mjs

      - name: Commit validated full-turn planner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js scripts/check-battle-turn-planner.mjs
          git rm -f scripts/materialize-battle-turn-planner.py
          git commit -m "feat: add full-turn Battle Sim planner"
          git push
