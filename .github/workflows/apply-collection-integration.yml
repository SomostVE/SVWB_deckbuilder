name: Apply collection integration

on:
  push:
    paths:
      - ".github/workflows/apply-collection-integration.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Integrate collection features
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('js/app.js')
          s = p.read_text(encoding='utf-8')

          if 'import { setupCollectionUI } from "./collection.js";' not in s:
              anchor = 'import { setupQol } from "./qol.js";\n'
              if anchor not in s: raise SystemExit('app import anchor missing')
              s = s.replace(anchor, anchor + 'import { setupCollectionUI } from "./collection.js";\n', 1)

          if 'let collectionUi = null;' not in s:
              anchor = 'let qol = null;\n'
              if anchor not in s: raise SystemExit('collection variable anchor missing')
              s = s.replace(anchor, anchor + 'let collectionUi = null;\n', 1)

          if 'collectionUi = setupCollectionUI' not in s:
              anchor = '    qol = setupQol({ state, renderEverything, renderCards, undoDeck, redoDeck });\n'
              if anchor not in s: raise SystemExit('collection setup anchor missing')
              s = s.replace(anchor, anchor + '    collectionUi = setupCollectionUI({ state, renderEverything });\n', 1)

          if '  collectionUi?.render();\n  renderSavedDecks();' not in s:
              anchor = '  renderAnalysis();\n  renderSavedDecks();'
              if anchor not in s: raise SystemExit('collection render anchor missing')
              s = s.replace(anchor, '  renderAnalysis();\n  collectionUi?.render();\n  renderSavedDecks();', 1)

          owned_pattern = re.compile(r'  onOwnedChange\(card, delta\) \{\n.*?\n  \},\n  onDiscover\(card\) \{', re.S)
          owned_replacement = '  onOwnedChange(card, delta) {\n    const maxOwned = Number(card.maxCopies ?? 3);\n    const next = Math.min(maxOwned, Math.max(0, (state.owned.get(card.id) ?? 0) + Number(delta)));\n    if (next === 0) state.owned.delete(card.id);\n    else state.owned.set(card.id, next);\n    persist();\n    renderCards();\n    renderDeck();\n    renderAnalysis();\n    collectionUi?.render();\n  },\n  onDiscover(card) {'
          s, count = owned_pattern.subn(owned_replacement, s, count=1)
          if count != 1: raise SystemExit('owned handler anchor missing')
          p.write_text(s, encoding='utf-8')

          p = Path('js/collection.js')
          s = p.read_text(encoding='utf-8')
          if not s.startswith('import { saveWorkspace }'):
              s = 'import { saveWorkspace } from "./storage.js";\n\n' + s
          s = s.replace('      persistOwned(state);', '      saveWorkspace(state);')

          if 'baseCardId: Number(card?.baseCardId ?? cardId),' not in s:
              anchor = '        cardId,\n        owned,'
              if anchor not in s: raise SystemExit('collection export anchor missing')
              s = s.replace(anchor, '        cardId,\n        baseCardId: Number(card?.baseCardId ?? cardId),\n        owned,', 1)

          if 'baseCardId: Number.isFinite(Number(entry.baseCardId))' not in s:
              anchor = '    cardId,\n    owned,\n    name:'
              if anchor not in s: raise SystemExit('collection normalize anchor missing')
              s = s.replace(anchor, '    cardId,\n    baseCardId: Number.isFinite(Number(entry.baseCardId)) ? Number(entry.baseCardId) : cardId,\n    owned,\n    name:', 1)

          if 'const baseMatches = state.cards.filter' not in s:
              anchor = '  const exact = state.cardMap.get(entry.cardId);\n  if (exact) return { id: exact.id, card: exact };\n\n'
              if anchor not in s: raise SystemExit('collection resolver anchor missing')
              fallback = '  const exact = state.cardMap.get(entry.cardId);\n  if (exact) return { id: exact.id, card: exact };\n\n  if (Number.isFinite(entry.baseCardId)) {\n    const baseMatches = state.cards.filter(card => Number(card.baseCardId) === Number(entry.baseCardId) && card.deckSelectable);\n    if (baseMatches.length === 1) return { id: baseMatches[0].id, card: baseMatches[0] };\n  }\n\n'
              s = s.replace(anchor, fallback, 1)

          s = re.sub(r'\nfunction persistOwned\(state\) \{.*?\n\}\n\nfunction setStatus', '\nfunction setStatus', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/update-cards.mjs')
          s = p.read_text(encoding='utf-8')
          if 'baseCardId:' not in s:
              anchor = '    id: Number(common.card_id ?? id),\n    name: common.name ?? "",'
              if anchor not in s: raise SystemExit('card updater anchor missing')
              s = s.replace(anchor, '    id: Number(common.card_id ?? id),\n    baseCardId: Number(common.base_card_id ?? common.card_id ?? id),\n    name: common.name ?? "",', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check js/app.js
          node --check js/collection.js
          node --check scripts/update-cards.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/collection.js scripts/update-cards.mjs
          git rm .github/workflows/apply-collection-integration.yml
          git commit -m "feat: integrate collection crafting and portable ownership data"
          git push
