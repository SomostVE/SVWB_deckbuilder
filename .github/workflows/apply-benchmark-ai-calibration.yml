name: Apply benchmark AI calibration UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-benchmark-ai-calibration.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Materialize benchmark calibration mode
        run: python3 scripts/materialize-benchmark-ai-calibration.py

      - name: Validate benchmark UI and engine
        run: |
          node --check js/battle-benchmark.js
          node --check js/battle-benchmark-worker.js
          node scripts/check-battle-benchmark.mjs
          node scripts/check-battle-benchmark-calibration.mjs
          node scripts/check-battle-benchmark-compare.mjs
          node scripts/check-battle-coverage-100.mjs
          node scripts/check-battle-v5-integration.mjs

      - name: Commit feature and cleanup helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add battle.html js/battle-benchmark.js js/battle-benchmark-worker.js
          git rm .github/workflows/apply-benchmark-ai-calibration.yml scripts/materialize-benchmark-ai-calibration.py
          git commit -m "feat: show AI mirror calibration in benchmark"
          git push
