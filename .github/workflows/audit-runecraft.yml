name: Audit Runecraft

on:
  push:
    branches: [audit-runecraft-full]
  pull_request:
    paths:
      - "scripts/audit-battle-class.mjs"
      - "js/battle-*.js"
      - "data/official/cards.json"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Audit Runecraft
        run: node scripts/audit-battle-class.mjs Runecraft
