name: Apply main card preview formatting

on:
  push:
    paths:
      - ".github/workflows/apply-main-preview-formatting.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch main card preview
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path("js/card-grid.js")
          s = js.read_text(encoding="utf-8")
          imp = 'import { formatCardText } from "./card-text.js";\n\n'
          if not s.startswith('import { formatCardText } from "./card-text.js";'):
              s = imp + s

          old = '        <div class="card-hover-effect">${escapeHtml(cleanPreviewText(card.text)).replaceAll("\\n", "<br>")}</div>'
          new = '        <div class="card-hover-effect">${formatCardText(card.rawSkillText || card.text || "No effect text.")}</div>'
          if old not in s:
              raise SystemExit("preview effect anchor missing")
          s = s.replace(old, new, 1)
          js.write_text(s, encoding="utf-8")

          css = Path("css/cards.css")
          c = css.read_text(encoding="utf-8")
          marker = "/* Official card text formatting in hover preview */"
          if marker not in c:
              addition = "\n\n/* Official card text formatting in hover preview */\n.card-hover-effect .card-text-keyword { color: #f2e1a3; font-weight: 800; }\n.card-hover-effect .card-text-emphasis { color: #d8dcff; }\n.card-hover-effect strong, .card-hover-effect span, .card-hover-effect em { display: inline; }\n.card-hover-effect em { color: #f0f2f8; font-style: italic; }\n.card-hover-effect .card-text-separator { height: 1px; margin: .45rem 0; border: 0; background: var(--border); }\n"
              c += addition
          css.write_text(c, encoding="utf-8")
          PY

      - name: Validate JavaScript
        run: node --check js/card-grid.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/card-grid.js css/cards.css
          git rm .github/workflows/apply-main-preview-formatting.yml
          git commit -m "feat: format official card text in main preview"
          git push