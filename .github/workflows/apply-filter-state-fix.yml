name: Apply filter state fix

on:
  push:
    paths:
      - ".github/workflows/apply-filter-state-fix.yml"
      - "scripts/apply-filter-state-fix.mjs"
      - "scripts/check-filter-state.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Materialize filter fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-filter-state-fix.mjs")
          text = path.read_text()
          text = text.replace("${SCROLL_KEY_PREFIX}", r"\${SCROLL_KEY_PREFIX}")
          path.write_text(text)
          PY
          node scripts/apply-filter-state-fix.mjs

      - name: Check syntax
        run: |
          node --check js/app.js
          node --check js/qol.js
          node --check js/filters.js
          node --check scripts/check-filter-state.mjs

      - name: Run filter regression
        run: node scripts/check-filter-state.mjs

      - name: Commit tested filter changes
        run: |
          if git diff --quiet -- js/app.js js/qol.js js/filters.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/qol.js js/filters.js
          git commit -m "fix: keep filters synchronized across classes"
          git push origin HEAD:main
