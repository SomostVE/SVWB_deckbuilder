name: Battle Sim mirror calibration

on:
  push:
    paths:
      - "scripts/benchmark-reference-mirrors.mjs"
      - "scripts/audit-battle-side-logic.mjs"
      - ".github/workflows/battle-mirror-calibration.yml"
  workflow_dispatch:

jobs:
  mirrors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Audit side compensation logic
        run: node scripts/audit-battle-side-logic.mjs

      - name: Run 1000-game mirrors
        run: node scripts/benchmark-reference-mirrors.mjs
