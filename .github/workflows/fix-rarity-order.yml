name: Fix rarity filter order

on:
  push:
    paths:
      - ".github/workflows/fix-rarity-order.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fix rarity order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text(encoding='utf-8')
          old = '  renderCheckboxGroup(els.rarityFilter, "Rarity", unique(available.map(card => card.rarity)), state.filters.rarities);'
          new = '  renderCheckboxGroup(els.rarityFilter, "Rarity", ["Bronze", "Silver", "Gold", "Legendary"].filter(value => available.some(card => card.rarity === value)), state.filters.rarities);'
          if old not in s:
              raise SystemExit('rarity render anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - run: node --check js/app.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "fix: order rarities Bronze Silver Gold Legendary"
          git push
