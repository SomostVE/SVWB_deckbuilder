name: Validate site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js scripts/*.mjs; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Check JSON
        run: |
          node -e "const fs=require('fs');for(const file of ['data/official/cards.json','data/official/metadata.json','data/official/changelog.json','data/custom/reference-decks.json','data/custom/reference-decks.source.json','data/custom/packages.json','data/custom/tags.json','data/custom/exclusions.json']){JSON.parse(fs.readFileSync(file,'utf8'));console.log('OK '+file)}"

      - name: Run Battle Sim exact-rule regressions
        run: node scripts/check-battle-rules.mjs

      - name: Run Battle Sim reactive-event regressions
        run: node scripts/check-battle-reactive-events.mjs

      - name: Run Battle Sim v5 integration
        run: node scripts/check-battle-v5-integration.mjs

      - name: Run Battle Sim smoke test
        run: node scripts/check-battle-sim.mjs

      - name: Run Battle Sim benchmark smoke test
        run: node scripts/check-battle-benchmark.mjs

      - name: Run Battle Sim benchmark calibration
        run: node scripts/check-battle-benchmark-calibration.mjs

      - name: Run paired benchmark comparison smoke test
        run: node scripts/check-battle-benchmark-compare.mjs
