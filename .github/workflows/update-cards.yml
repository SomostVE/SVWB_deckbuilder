name: Update card database

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Update card data
        run: node scripts/update-cards.mjs

      - name: Validate card data
        run: |
          node -e "const fs=require('fs');const cards=JSON.parse(fs.readFileSync('data/official/cards.json','utf8'));if(!Array.isArray(cards)||cards.length<100)throw new Error('Card update returned an invalid or suspiciously small database');console.log(cards.length+' cards validated')"

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official/cards.json data/official/metadata.json
          git commit -m "chore: update Shadowverse card data"
          git push
