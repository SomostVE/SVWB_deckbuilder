name: Apply Portalcraft Battle Sim rules

on:
  push:
    branches: [agent/portalcraft-audit]
    paths:
      - ".github/workflows/apply-battle-portalcraft-full.yml"
      - "scripts/apply-battle-portalcraft-full.py"
      - "scripts/check-battle-portalcraft-full.mjs"
  pull_request:
    paths:
      - ".github/workflows/apply-battle-portalcraft-full.yml"
      - "scripts/apply-battle-portalcraft-full.py"
      - "scripts/check-battle-portalcraft-full.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Materialize Portalcraft rules
        run: |
          if grep -q 'battle-portalcraft-full-rules' js/battle-engine-v5.js; then
            echo 'Portalcraft rules already materialized.'
          else
            python3 scripts/apply-battle-portalcraft-full.py
          fi

      - name: Check syntax
        run: |
          node --check js/battle-engine-v5.js
          node --check scripts/check-battle-portalcraft-full.mjs

      - name: Run Portalcraft regression
        run: |
          node scripts/check-battle-portalcraft-full.mjs
          node scripts/check-battle-coverage-100.mjs
          node scripts/check-battle-rules.mjs
          node scripts/check-battle-reactive-events.mjs
          node scripts/check-battle-artifact-history.mjs
          node scripts/check-battle-runecraft-full.mjs
          node scripts/check-battle-swordcraft-full.mjs
          node scripts/check-battle-forestcraft-full.mjs
          node scripts/check-battle-dragoncraft-full.mjs
          node scripts/check-battle-abysscraft-full.mjs

      - name: Commit tested engine changes
        run: |
          if git diff --quiet -- js/battle-engine-v5.js; then
            echo "No engine changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js
          git commit -m "feat: complete Portalcraft Battle Sim class pass"
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
