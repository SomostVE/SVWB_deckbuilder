name: Battle Sim AI v2 refinement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/battle-ai-v2-refine.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Diagnose Ward mirror sides
        run: node scripts/diagnose-ward-side.mjs
