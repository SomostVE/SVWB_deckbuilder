name: Battle Sim AI v2 cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/battle-ai-v2-refine.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove temporary refinement helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/battle-ai-v2-refine.yml \
            scripts/materialize-battle-ai-v2.py \
            scripts/materialize-battle-ai-v21.py \
            scripts/materialize-battle-ai-v22.py \
            scripts/materialize-battle-ai-v23.py \
            scripts/diagnose-ward-side.mjs
          git commit -m "chore: remove Battle Sim AI refinement helpers"
          git push
