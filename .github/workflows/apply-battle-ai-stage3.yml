name: Apply Battle AI Stage 3

on:
  push:
    branches:
      - ai-stage3-01.05.005

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ai-stage3-01.05.005
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply stage 3 migration
        run: node scripts/apply-battle-ai-stage3.mjs
      - name: Correct combat-efficiency audit scenario
        run: |
          node -e "const fs=require('fs');const p='scripts/audit-battle-ai-behavior.mjs';let s=fs.readFileSync(p,'utf8');s=s.replace('hand: [], pp: 0, maxPp: 5, personalTurn: 5, ep: 0, sep: 0, opponentHp: 10,\n  strategy: { style: \"midrange\" },\n  board: [\n    { name: \"Audit Cheap Trader\"','hand: [], pp: 0, maxPp: 5, hp: 2, personalTurn: 5, ep: 0, sep: 0, opponentHp: 20,\n  strategy: { style: \"midrange\" },\n  board: [\n    { name: \"Audit Cheap Trader\"');fs.writeFileSync(p,s)"
      - name: Commit migrated engine
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js scripts/audit-battle-ai-behavior.mjs version.json battle.html
          git commit -m "Refine Battle AI stage 3 combat audit"
          git push origin HEAD:ai-stage3-01.05.005
