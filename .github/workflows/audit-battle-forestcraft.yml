name: Audit Forestcraft Battle Sim

on:
  pull_request:
    paths:
      - ".github/workflows/audit-battle-forestcraft.yml"
      - "js/battle-engine-v5.js"
      - "js/battle-rules.js"
      - "data/official/cards.json"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Audit Forestcraft support
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs/promises';
          import { analyzeCardSupport } from './js/battle-engine-v5.js';

          const cards = JSON.parse(await fs.readFile('./data/official/cards.json', 'utf8'));
          const map = new Map(cards.map(card => [Number(card.id), card]));
          for (const card of cards) {
            card.__relatedCardObjects = (card.relatedCards ?? []).map(id => map.get(Number(id))).filter(Boolean);
            card.__relatedNames = card.__relatedCardObjects.map(item => item.name);
          }

          const forest = cards.filter(card => String(card.class ?? '').toLowerCase() === 'forestcraft');
          const rows = forest.map(card => ({ card, support: analyzeCardSupport(card) }));
          const counts = rows.reduce((acc, row) => {
            acc[row.support.level] = (acc[row.support.level] ?? 0) + 1;
            return acc;
          }, {});

          console.log(`FOREST SUMMARY total=${forest.length} full=${counts.full ?? 0} partial=${counts.partial ?? 0} unsupported=${counts.unsupported ?? 0}`);
          for (const row of rows.filter(row => row.support.level !== 'full')) {
            console.log(`\n=== ${row.support.level.toUpperCase()} :: ${row.card.name} ===`);
            console.log(`REASON: ${row.support.reason}`);
            console.log(JSON.stringify({
              id: row.card.id,
              name: row.card.name,
              type: row.card.type,
              cost: row.card.cost,
              attack: row.card.attack,
              defense: row.card.defense,
              keywords: row.card.keywords,
              traits: row.card.traits,
              text: row.card.text,
              relatedCards: row.card.__relatedNames
            }, null, 2));
          }

          console.log('\n=== RELATED OBJECTS FOR FOREST PARTIALS ===');
          const partials = rows.filter(row => row.support.level !== 'full').map(row => row.card);
          const relatedIds = new Set(partials.flatMap(card => card.relatedCards ?? []).map(Number));
          for (const id of relatedIds) {
            const card = map.get(id);
            if (!card) continue;
            console.log(`\n--- RELATED ${card.id} :: ${card.name} ---`);
            console.log(JSON.stringify({
              id: card.id,
              name: card.name,
              class: card.class,
              type: card.type,
              cost: card.cost,
              attack: card.attack,
              defense: card.defense,
              keywords: card.keywords,
              traits: card.traits,
              text: card.text,
              relatedCards: (card.relatedCards ?? []).map(id => map.get(Number(id))?.name ?? id)
            }, null, 2));
          }
          EOF

      - name: Inspect Forestcraft-specific engine hooks
        run: |
          echo '=== FOREST REFERENCES IN ENGINE/RULES ==='
          grep -RniE "Forestcraft|Combo|Fairy|Fairies|Pixie|Bounce|return .* allied|played this turn|cards played|Rose|Wisp|Verdant|Ivy|Aria|Ladica|Sekka|Castelle|Woodland|Elder|Whirlwind|Fairy Beast|Fuse|Faith|Crest" js/battle-engine-v5.js js/battle-rules.js js/battle-rules-core.js | head -n 1500 || true
