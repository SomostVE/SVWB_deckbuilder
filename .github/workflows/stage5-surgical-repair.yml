name: Repair Stage 5 lethal solver

on:
  push:
    branches:
      - ai-stage5-final-01.05.007

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 5 branch
        uses: actions/checkout@v6
        with:
          ref: ai-stage5-final-01.05.007
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Repair Stage 5 behavior gates
        run: |
          node scripts/fix-stage5-gates.mjs
          node --check scripts/audit-battle-ai-behavior.mjs

      - name: Commit Stage 5 gate correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-battle-ai-behavior.mjs
          if git diff --cached --quiet; then
            echo "No Stage 5 gate changes to commit."
            exit 0
          fi
          git commit -m "Accept equivalent Stage 5 lethal evolution lines"
          git push origin HEAD:ai-stage5-final-01.05.007
