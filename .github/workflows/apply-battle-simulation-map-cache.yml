name: Apply Battle Sim simulation map cache

on:
  push:
    paths:
      - ".github/workflows/apply-battle-simulation-map-cache.yml"
      - "scripts/apply-battle-simulation-map-cache.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Materialize cache
        run: node scripts/apply-battle-simulation-map-cache.mjs

      - name: Check syntax
        run: node --check js/battle-engine-v5.js

      - name: Run Battle Sim regressions
        run: |
          node scripts/check-battle-v5-integration.mjs
          node scripts/check-battle-sim.mjs
          node scripts/check-battle-benchmark.mjs
          node scripts/check-battle-benchmark-calibration.mjs

      - name: Commit tested engine change
        run: |
          if git diff --quiet -- js/battle-engine-v5.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js
          git commit -m "perf: cache prepared Battle Sim card map"
          git push origin HEAD:main
