name: Check two-turn planner performance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-two-turn-perf.yml
      - scripts/materialize-battle-two-turn-lookahead.py
      - scripts/materialize-battle-two-turn-lookahead-v2.py
      - scripts/materialize-battle-two-turn-lookahead-tuning.py
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: |
          python3 scripts/materialize-battle-two-turn-lookahead-v2.py
          python3 scripts/materialize-battle-two-turn-lookahead-tuning.py
      - name: Profile tests
        shell: bash
        run: |
          set +e
          for f in \
            scripts/check-battle-two-turn-lookahead.mjs \
            scripts/check-battle-turn-planner.mjs \
            scripts/check-battle-target-branching.mjs \
            scripts/check-battle-fuse.mjs \
            scripts/check-battle-ai-lookahead.mjs \
            scripts/check-battle-rules.mjs \
            scripts/check-battle-reactive-events.mjs \
            scripts/check-battle-artifact-history.mjs \
            scripts/check-battle-focus-rules.mjs \
            scripts/check-battle-ability-evolve.mjs \
            scripts/check-battle-asher.mjs \
            scripts/check-battle-coverage-100.mjs \
            scripts/check-battle-v5-integration.mjs \
            scripts/check-battle-sim.mjs \
            scripts/check-battle-benchmark.mjs \
            scripts/check-battle-benchmark-calibration.mjs \
            scripts/check-battle-benchmark-compare.mjs; do
              echo "=== $f ==="
              /usr/bin/time -f 'elapsed=%e exit=%x' timeout 30s node "$f"
              echo "status=$?"
          done
