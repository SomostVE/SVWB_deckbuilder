name: Apply Battle Sim Fuse action

on:
  push:
    branches: [main]
    paths:
      - scripts/materialize-battle-fuse.py
      - scripts/check-battle-fuse.mjs
      - .github/workflows/apply-battle-fuse.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Materialize Fuse support
        run: python3 scripts/materialize-battle-fuse.py

      - name: Keep Fuse regression in normal CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/validate-site.yml')
          text = path.read_text()
          anchor = '''      - name: Run Battle Sim tactical look-ahead regression\n        run: node scripts/check-battle-ai-lookahead.mjs\n'''
          insert = anchor + '''\n      - name: Run Battle Sim Fuse regression\n        run: node scripts/check-battle-fuse.mjs\n'''
          if 'Run Battle Sim Fuse regression' not in text:
              if anchor not in text:
                  raise SystemExit('validate-site anchor missing')
              text = text.replace(anchor, insert, 1)
              path.write_text(text)
          PY

      - name: Validate Fuse and Battle Sim
        run: |
          node --check js/battle-engine-v5.js
          node scripts/check-battle-fuse.mjs
          node scripts/check-battle-ai-lookahead.mjs
          node scripts/check-battle-rules.mjs
          node scripts/check-battle-reactive-events.mjs
          node scripts/check-battle-artifact-history.mjs
          node scripts/check-battle-focus-rules.mjs
          node scripts/check-battle-ability-evolve.mjs
          node scripts/check-battle-asher.mjs
          node scripts/check-battle-coverage-100.mjs
          node scripts/check-battle-v5-integration.mjs
          node scripts/check-battle-sim.mjs
          node scripts/check-battle-benchmark.mjs
          node scripts/check-battle-benchmark-calibration.mjs
          node scripts/check-battle-benchmark-compare.mjs

      - name: Run 1000-game reference mirrors
        run: node scripts/benchmark-reference-mirrors.mjs

      - name: Commit validated Fuse support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js scripts/check-battle-fuse.mjs .github/workflows/validate-site.yml
          git rm -f scripts/materialize-battle-fuse.py scripts/audit-fuse-cards.mjs .github/workflows/audit-fuse-cards.yml .github/workflows/apply-battle-fuse.yml
          git commit -m "feat: add Fuse action to Battle Sim"
          git push
