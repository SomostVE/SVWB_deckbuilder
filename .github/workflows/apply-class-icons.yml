name: Apply official class icons

on:
  push:
    paths:
      - ".github/workflows/apply-class-icons.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch header class controls
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = dedent('''
                <div class="header-control header-class-control">
                  <span class="header-control-label">Class</span>
                  <div id="class-filter" class="class-list header-class-list"></div>
                </div>
                <div id="type-filter" class="header-filter-root"></div>
                <div id="rarity-filter" class="header-filter-root"></div>
          ''').strip('\n')
          new = dedent('''
                <div class="header-control header-class-control">
                  <div id="class-filter" class="class-list header-class-list"></div>
                </div>
                <div id="rarity-filter" class="header-filter-root header-rarity-root"></div>
                <div id="type-filter" class="header-filter-root"></div>
          ''').strip('\n')
          if old not in s:
              raise SystemExit('header order anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('js/app.js')
          s = p.read_text(encoding='utf-8')
          anchor = 'let qol = null;\n\ninit();'
          icon_map = dedent('''
              let qol = null;

              const CLASS_ICON_URLS = {
                Forestcraft: "https://shadowverse-wb.com/assets/images/common/common/class/class_elf.svg",
                Swordcraft: "https://shadowverse-wb.com/assets/images/common/common/class/class_royal.svg",
                Runecraft: "https://shadowverse-wb.com/assets/images/common/common/class/class_witch.svg",
                Dragoncraft: "https://shadowverse-wb.com/assets/images/common/common/class/class_dragon.svg",
                Abysscraft: "https://shadowverse-wb.com/assets/images/common/common/class/class_nightmare.svg",
                Havencraft: "https://shadowverse-wb.com/assets/images/common/common/class/class_bishop.svg",
                Portalcraft: "https://shadowverse-wb.com/assets/images/common/common/class/class_nemesis.svg",
                Neutral: "https://shadowverse-wb.com/assets/images/common/common/class/class_neutral.svg"
              };

              init();
          ''').strip('\n')
          if anchor not in s:
              raise SystemExit('class icon map anchor missing')
          s = s.replace(anchor, icon_map, 1)

          start = s.index('function renderClassFilter() {')
          end = s.index('\nfunction renderFilterGroups() {', start)
          replacement = dedent('''
              function renderClassFilter() {
                els.classFilter.innerHTML = "";

                for (const className of CLASSES) {
                  const button = document.createElement("button");
                  button.type = "button";
                  button.className = "class-button class-icon-button";
                  button.title = className;
                  button.setAttribute("aria-label", className);
                  button.classList.toggle("active", className === state.selectedClass);

                  const icon = document.createElement("img");
                  icon.src = CLASS_ICON_URLS[className];
                  icon.alt = "";
                  icon.draggable = false;
                  button.appendChild(icon);

                  button.addEventListener("click", () => {
                    state.selectedClass = className;
                    state.discoverCardId = null;
                    persist();
                    renderEverything();
                  });
                  els.classFilter.appendChild(button);
                }

                const neutral = document.createElement("label");
                neutral.className = "neutral-toggle neutral-icon-toggle";
                neutral.title = "Neutral";
                neutral.setAttribute("aria-label", "Include Neutral cards");

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = state.includeNeutral;
                checkbox.addEventListener("change", () => {
                  state.includeNeutral = checkbox.checked;
                  state.discoverCardId = null;
                  persist();
                  renderEverything();
                });

                const icon = document.createElement("img");
                icon.src = CLASS_ICON_URLS.Neutral;
                icon.alt = "";
                icon.draggable = false;

                neutral.append(checkbox, icon);
                els.classFilter.appendChild(neutral);
              }
          ''').strip('\n')
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

          p = Path('css/filters.css')
          s = p.read_text(encoding='utf-8')
          css = dedent('''

              /* Official Shadowverse class icon controls */
              .header-class-list .class-icon-button {
                display: grid;
                place-items: center;
                width: 38px;
                height: 38px;
                padding: .22rem;
              }

              .header-class-list .class-icon-button img,
              .header-class-list .neutral-icon-toggle img {
                display: block;
                width: 29px;
                height: 29px;
                object-fit: contain;
                pointer-events: none;
              }

              .header-class-list .neutral-icon-toggle {
                position: relative;
                display: grid;
                place-items: center;
                width: 38px;
                height: 38px;
                padding: .22rem;
                cursor: pointer;
              }

              .header-class-list .neutral-icon-toggle input {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                opacity: 0;
                cursor: pointer;
              }

              .header-class-list .neutral-icon-toggle:has(input:checked) {
                border-color: var(--accent);
                background: rgba(124,140,255,.16);
              }

              .header-rarity-root .filter-group-title {
                display: none;
              }

              .header-rarity-root .filter-group {
                padding-left: 0;
                border-left: 0;
              }
          ''')
          s += css
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check js/app.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/app.js css/filters.css
          git commit -m "feat: use official class icons in header"
          git push
