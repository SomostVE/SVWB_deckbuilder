name: Apply Battle Sim focus rules

on:
  push:
    paths:
      - ".github/workflows/apply-battle-focus-rules.yml"
      - "scripts/apply-battle-focus-rules.mjs"
      - "scripts/apply-battle-asher.mjs"
      - "scripts/apply-battle-coverage-100.py"
      - "scripts/apply-battle-combat-order-fix.mjs"
      - "scripts/apply-battle-ai-v1.mjs"
      - "scripts/check-battle-asher.mjs"
      - "scripts/check-battle-coverage-100.mjs"
      - "scripts/check-battle-combat-order.mjs"
      - "scripts/check-battle-ai-v1.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Materialize tested Battle Sim rules and AI
        run: |
          node scripts/apply-battle-focus-rules.mjs
          node scripts/apply-battle-asher.mjs
          python3 scripts/apply-battle-coverage-100.py
          node scripts/apply-battle-combat-order-fix.mjs
          node scripts/apply-battle-ai-v1.mjs

      - name: Check changed JavaScript syntax
        run: |
          node --check js/battle-rules-core.js
          node --check js/battle-rules.js
          node --check js/battle-engine-v4.js
          node --check js/battle-engine-v5.js

      - name: Run Battle Sim regressions
        run: |
          node scripts/check-battle-focus-rules.mjs
          node scripts/check-battle-ability-evolve.mjs
          node scripts/check-battle-asher.mjs
          node scripts/check-battle-coverage-100.mjs
          node scripts/check-battle-combat-order.mjs
          node scripts/check-battle-ai-v1.mjs

      - name: Commit tested engine changes
        run: |
          if git diff --quiet -- js/battle-rules-core.js js/battle-rules.js js/battle-engine-v4.js js/battle-engine-v5.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-rules-core.js js/battle-rules.js js/battle-engine-v4.js js/battle-engine-v5.js
          git commit -m "feat: improve baseline AI Extra PP decisions"
          git push origin HEAD:main
