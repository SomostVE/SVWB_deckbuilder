# Validation branch for materializing the remaining Havencraft rules.
name: Apply Battle Sim focus rules

on:
  push:
    paths:
      - ".github/workflows/apply-battle-focus-rules.yml"
      - "scripts/apply-battle-haven-full.py"
      - "scripts/check-battle-haven-full.mjs"
      - "scripts/check-battle-actual-damage.mjs"
  pull_request:
    paths:
      - ".github/workflows/apply-battle-focus-rules.yml"
      - "scripts/apply-battle-haven-full.py"
      - "scripts/check-battle-haven-full.mjs"
      - "scripts/check-battle-actual-damage.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Materialize pending Battle Sim rules
        run: python3 scripts/apply-battle-haven-full.py

      - name: Check changed JavaScript syntax
        run: |
          node --check js/battle-rules-core.js
          node --check js/battle-rules.js
          node --check js/battle-engine-v4.js
          node --check js/battle-engine-v5.js

      - name: Run Battle Sim regressions
        run: |
          node scripts/check-battle-focus-rules.mjs
          node scripts/check-battle-ability-evolve.mjs
          node scripts/check-battle-asher.mjs
          node scripts/check-battle-coverage-100.mjs
          node scripts/check-battle-haven-full.mjs
          node scripts/check-battle-combat-order.mjs
          node scripts/check-battle-actual-damage.mjs
          node scripts/check-battle-ai-v1.mjs
          node scripts/check-battle-ai-evolution.mjs
          node scripts/check-battle-ai-lethal.mjs

      - name: Commit tested engine changes
        run: |
          if git diff --quiet -- js/battle-rules-core.js js/battle-rules.js js/battle-engine-v4.js js/battle-engine-v5.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-rules-core.js js/battle-rules.js js/battle-engine-v4.js js/battle-engine-v5.js
          git commit -m "feat: materialize tested Battle Sim rules"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
