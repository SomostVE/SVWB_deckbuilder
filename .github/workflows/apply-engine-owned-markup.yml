name: Apply engine owned and markup improvements

on:
  push:
    paths:
      - ".github/workflows/apply-engine-owned-markup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch Deck Engines
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('js/engines.js')
          s = p.read_text(encoding='utf-8')

          old = '''  const inDeck = deckCards.filter(card => Number(state.deck.get(card.id) ?? 0) > 0);
            const deckCopies = deckCards.reduce((sum, card) => sum + Number(state.deck.get(card.id) ?? 0), 0);
            const averageCost = deckCards.length'''
          new = '''  const inDeck = deckCards.filter(card => Number(state.deck.get(card.id) ?? 0) > 0);
            const deckCopies = deckCards.reduce((sum, card) => sum + Number(state.deck.get(card.id) ?? 0), 0);
            const ownedCards = deckCards.filter(card => Number(state.owned.get(card.id) ?? 0) > 0);
            const ownedCopies = deckCards.reduce((sum, card) => sum + Math.max(0, Number(state.owned.get(card.id) ?? 0)), 0);
            const averageCost = deckCards.length'''
          if old not in s:
              raise SystemExit('metrics anchor missing')
          s = s.replace(old, new, 1)

          old = '''  item.inDeckCards = inDeck.length;
            item.deckCopies = deckCopies;
            item.coverage = deckCards.length ? inDeck.length / deckCards.length : 0;
            item.averageCost = averageCost;'''
          new = '''  item.inDeckCards = inDeck.length;
            item.deckCopies = deckCopies;
            item.coverage = deckCards.length ? inDeck.length / deckCards.length : 0;
            item.ownedCards = ownedCards.length;
            item.ownedCopies = ownedCopies;
            item.ownedCoverage = deckCards.length ? ownedCards.length / deckCards.length : 0;
            item.averageCost = averageCost;'''
          if old not in s:
              raise SystemExit('metric assignments anchor missing')
          s = s.replace(old, new, 1)

          old = '''    const confidenceClass = String(item.confidence ?? "").toLowerCase() === "strong" ? "strong" : "medium";
            const coveragePercent = Math.round(item.coverage * 100);
            button.innerHTML = `'''
          new = '''    const confidenceClass = String(item.confidence ?? "").toLowerCase() === "strong" ? "strong" : "medium";
            const coveragePercent = Math.round(item.coverage * 100);
            const ownedPercent = Math.round((item.ownedCoverage ?? 0) * 100);
            button.innerHTML = `'''
          if old not in s:
              raise SystemExit('grid percentage anchor missing')
          s = s.replace(old, new, 1)

          old = '''        <div class="engine-coverage">
                  <div class="engine-coverage-row"><span>Deck coverage</span><span>${item.inDeckCards}/${item.cards.length} cards · ${item.deckCopies} copies</span></div>
                  <div class="engine-coverage-track"><div class="engine-coverage-fill" style="width:${coveragePercent}%"></div></div>
                </div>'''
          new = '''        <div class="engine-coverage">
                  <div class="engine-coverage-row"><span>Deck coverage</span><span>${item.inDeckCards}/${item.cards.length} cards · ${item.deckCopies} copies</span></div>
                  <div class="engine-coverage-track"><div class="engine-coverage-fill" style="width:${coveragePercent}%"></div></div>
                </div>
                <div class="engine-coverage engine-owned-coverage">
                  <div class="engine-coverage-row"><span>Owned</span><span>${item.ownedCards ?? 0}/${item.cards.length} cards · ${item.ownedCopies ?? 0} copies</span></div>
                  <div class="engine-coverage-track"><div class="engine-coverage-fill engine-owned-fill" style="width:${ownedPercent}%"></div></div>
                </div>'''
          if old not in s:
              raise SystemExit('grid coverage anchor missing')
          s = s.replace(old, new, 1)

          old = '''          <p>${escapeHtml(card.text || "No effect text.")}</p>'''
          new = '''          <p>${renderCardText(card.rawSkillText || card.text || "No effect text.")}</p>'''
          if old not in s:
              raise SystemExit('card text anchor missing')
          s = s.replace(old, new, 1)

          old = '''    <div class="engine-stat"><strong>${item.inDeckCards}/${item.cards.length}</strong><span>Present in deck</span></div>
                <div class="engine-stat"><strong>${item.deckCopies}</strong><span>Copies in deck</span></div>
                <div class="engine-stat"><strong>${item.averageCost.toFixed(1)}</strong><span>Average cost</span></div>'''
          new = '''    <div class="engine-stat"><strong>${item.inDeckCards}/${item.cards.length}</strong><span>Present in deck</span></div>
                <div class="engine-stat"><strong>${item.deckCopies}</strong><span>Copies in deck</span></div>
                <div class="engine-stat"><strong>${item.ownedCards ?? 0}/${item.cards.length}</strong><span>Owned cards</span></div>
                <div class="engine-stat"><strong>${item.ownedCopies ?? 0}</strong><span>Owned copies</span></div>
                <div class="engine-stat"><strong>${item.averageCost.toFixed(1)}</strong><span>Average cost</span></div>'''
          if old not in s:
              raise SystemExit('dialog stats anchor missing')
          s = s.replace(old, new, 1)

          anchor = '''function escapeHtml(value) {'''
          helper = r'''function renderCardText(value) {
            let source = decodeCardEntities(String(value ?? ""));
            if (!source.trim()) return "No effect text.";

            const tokens = [];
            const keep = html => {
              const token = `@@SVWB_FORMAT_${tokens.length}@@`;
              tokens.push([token, html]);
              return token;
            };

            source = source
              .replace(/<hr\s*\/?\s*>/gi, () => keep('<hr class="engine-text-separator">'))
              .replace(/<br\s*\/?\s*>/gi, () => keep('<br>'))
              .replace(/<b\s*>/gi, () => keep('<strong>'))
              .replace(/<\/b\s*>/gi, () => keep('</strong>'))
              .replace(/<i\s*>/gi, () => keep('<em>'))
              .replace(/<\/i\s*>/gi, () => keep('</em>'))
              .replace(/<color\s*=\s*Keyword\s*>/gi, () => keep('<span class="engine-text-keyword">'))
              .replace(/<color\s*=\s*[^>]+>/gi, () => keep('<span class="engine-text-emphasis">'))
              .replace(/<\/color\s*>/gi, () => keep('</span>'))
              .replace(/<[^>]+>/g, "");

            let html = escapeHtml(source).replace(/\r?\n/g, '<br>');
            for (const [token, replacement] of tokens) html = html.replaceAll(token, replacement);
            return html;
          }

          function decodeCardEntities(value) {
            return String(value ?? "")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;|&#x27;/gi, "'")
              .replace(/&amp;/gi, "&");
          }

          '''
          if 'function renderCardText(value)' not in s:
              if anchor not in s:
                  raise SystemExit('escape helper anchor missing')
              s = s.replace(anchor, helper + anchor, 1)

          p.write_text(s, encoding='utf-8')

          p = Path('css/engines.css')
          css = p.read_text(encoding='utf-8')
          marker = '/* Owned collection + official card text formatting */'
          if marker not in css:
              css += r'''

          /* Owned collection + official card text formatting */
          .engine-owned-coverage {
            margin-top: .34rem;
          }

          .engine-owned-fill {
            background: linear-gradient(90deg, #46a86d, #78d79a);
          }

          .engine-card-profile .engine-text-keyword {
            color: #f2e1a3;
            font-weight: 800;
          }

          .engine-card-profile .engine-text-emphasis {
            color: #d8dcff;
          }

          .engine-card-profile em {
            color: #f0f2f8;
            font-style: italic;
          }

          .engine-card-profile strong {
            display: inline;
            padding-right: 0;
            font-size: inherit;
          }

          .engine-text-separator {
            height: 1px;
            margin: .45rem 0;
            border: 0;
            background: var(--border);
          }
          '''
          p.write_text(css, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check js/engines.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/engines.js css/engines.css
          git rm .github/workflows/apply-engine-owned-markup.yml
          git commit -m "feat: show owned engine coverage and formatted card text"
          git push
