name: Apply engine owned and markup improvements

on:
  push:
    paths:
      - ".github/workflows/apply-engine-owned-markup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch Deck Engines
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('js/engines.js')
          s = p.read_text(encoding='utf-8')

          if 'import { formatCardText } from "./card-text.js";' not in s:
              anchor = 'import { addCards } from "./deck.js";\n'
              if anchor not in s: raise SystemExit('import anchor missing')
              s = s.replace(anchor, anchor + 'import { formatCardText } from "./card-text.js";\n', 1)

          if 'const ownedCards = deckCards.filter' not in s:
              anchor = '  const deckCopies = deckCards.reduce((sum, card) => sum + Number(state.deck.get(card.id) ?? 0), 0);\n'
              if anchor not in s: raise SystemExit('metrics anchor missing')
              s = s.replace(anchor, anchor + '  const ownedCards = deckCards.filter(card => Number(state.owned.get(card.id) ?? 0) > 0);\n  const ownedCopies = deckCards.reduce((sum, card) => sum + Math.max(0, Number(state.owned.get(card.id) ?? 0)), 0);\n', 1)

          if 'item.ownedCoverage =' not in s:
              anchor = '  item.coverage = deckCards.length ? inDeck.length / deckCards.length : 0;\n'
              if anchor not in s: raise SystemExit('metric assignment anchor missing')
              s = s.replace(anchor, anchor + '  item.ownedCards = ownedCards.length;\n  item.ownedCopies = ownedCopies;\n  item.ownedCoverage = deckCards.length ? ownedCards.length / deckCards.length : 0;\n', 1)

          if 'const ownedPercent =' not in s:
              anchor = '    const coveragePercent = Math.round(item.coverage * 100);\n'
              if anchor not in s: raise SystemExit('coverage percent anchor missing')
              s = s.replace(anchor, anchor + '    const ownedPercent = Math.round((item.ownedCoverage ?? 0) * 100);\n', 1)

          if 'engine-owned-coverage' not in s:
              old = '<div class="engine-coverage">\n          <div class="engine-coverage-row"><span>Deck coverage</span><span>${item.inDeckCards}/${item.cards.length} cards · ${item.deckCopies} copies</span></div>\n          <div class="engine-coverage-track"><div class="engine-coverage-fill" style="width:${coveragePercent}%"></div></div>\n        </div>'
              new = old + '\n        <div class="engine-coverage engine-owned-coverage">\n          <div class="engine-coverage-row"><span>Owned</span><span>${item.ownedCards ?? 0}/${item.cards.length} cards · ${item.ownedCopies ?? 0} copies</span></div>\n          <div class="engine-coverage-track"><div class="engine-coverage-fill engine-owned-fill" style="width:${ownedPercent}%"></div></div>\n        </div>'
              if old not in s: raise SystemExit('grid coverage anchor missing')
              s = s.replace(old, new, 1)

          if 'formatCardText(card.rawSkillText' not in s:
              old = '<p>${escapeHtml(card.text || "No effect text.")}</p>'
              if old not in s: raise SystemExit('card text anchor missing')
              s = s.replace(old, '<p>${formatCardText(card.rawSkillText || card.text || "No effect text.")}</p>', 1)

          if '<span>Owned cards</span>' not in s:
              anchor = '    <div class="engine-stat"><strong>${item.deckCopies}</strong><span>Copies in deck</span></div>\n'
              if anchor not in s: raise SystemExit('dialog stats anchor missing')
              s = s.replace(anchor, anchor + '    <div class="engine-stat"><strong>${item.ownedCards ?? 0}/${item.cards.length}</strong><span>Owned cards</span></div>\n    <div class="engine-stat"><strong>${item.ownedCopies ?? 0}</strong><span>Owned copies</span></div>\n', 1)

          p.write_text(s, encoding='utf-8')

          p = Path('css/engines.css')
          css = p.read_text(encoding='utf-8')
          imp = '@import url("./engine-enhancements.css");\n'
          if imp not in css:
              css = imp + css
              p.write_text(css, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check js/engines.js
          node --check js/card-text.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/engines.js css/engines.css
          git rm .github/workflows/apply-engine-owned-markup.yml
          git commit -m "feat: show owned engine coverage and formatted card text"
          git push
