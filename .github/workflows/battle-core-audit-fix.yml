name: Battle Sim core audit fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/battle-core-audit-fix.yml"

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Apply audited rules and baseline AI fixes
        run: |
          python3 scripts/materialize-battle-core-audit.py
          python3 scripts/patch-reactive-skybound-test.py

      - name: Syntax and Battle Sim regressions
        run: |
          for file in js/*.js scripts/*.mjs; do node --check "$file"; done
          node scripts/check-battle-rules.mjs
          node scripts/check-battle-reactive-events.mjs
          node scripts/check-battle-artifact-history.mjs
          node scripts/check-battle-focus-rules.mjs
          node scripts/check-battle-ability-evolve.mjs
          node scripts/check-battle-asher.mjs
          node scripts/check-battle-coverage-100.mjs
          node scripts/check-battle-v5-integration.mjs
          node scripts/check-battle-sim.mjs
          node scripts/check-battle-benchmark.mjs
          node scripts/check-battle-benchmark-calibration.mjs
          node scripts/check-battle-benchmark-compare.mjs

      - name: Re-run 1000-game mirrors
        run: node scripts/benchmark-reference-mirrors.mjs

      - name: Commit audited fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/battle-engine-v5.js js/battle-rules.js scripts/check-battle-rules.mjs scripts/check-battle-reactive-events.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: audit Battle Sim core rules and baseline AI"
          git push
