<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadowverse Deck Assistant</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/cards.css">
  <link rel="stylesheet" href="./css/deck.css">
  <link rel="stylesheet" href="./css/filters.css">
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div>
        <h1>Shadowverse Deck Assistant</h1>
        <p>Explore cards, build decks, and learn synergies.</p>
      </div>
      <button id="clear-deck" class="button button-danger" type="button">Clear deck</button>
    </div>

    <div class="header-toolbar">
      <div class="header-control header-class-control">
        <span class="header-control-label">Class</span>
        <div id="class-filter" class="class-list header-class-list"></div>
      </div>
      <div id="type-filter" class="header-filter-root"></div>
      <div id="rarity-filter" class="header-filter-root"></div>
    </div>
  </header>

  <main class="app-shell">
    <aside class="sidebar">
      <section>
        <h2>Search</h2>
        <input id="search-input" class="input" type="search" placeholder="Search cards...">
      </section>

      <section id="filters-root">
        <h2>Filters</h2>
        <div id="set-filter"></div>
        <div id="trait-filter"></div>
        <div id="keyword-filter"></div>
      </section>
    </aside>

    <section class="content">
      <div class="content-toolbar">
        <strong id="results-count">0 cards</strong>
        <button id="reset-filters" class="button" type="button">Reset filters</button>
      </div>
      <div id="card-grid" class="card-grid"></div>
    </section>

    <aside class="deck-panel">
      <div class="deck-header">
        <h2>Deck</h2>
        <strong id="deck-count">0 / 40</strong>
      </div>
      <div id="deck-list" class="deck-list"></div>
    </aside>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
